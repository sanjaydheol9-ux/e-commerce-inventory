name: SEPM CI/CD Pipeline - Monolith vs Microservices

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  monolith-validation:
    name: 1. Modular Monolith Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Modular Monolith Integration Tests
        run: npm run test:monolith

  microservices-validation:
    name: 2. Microservices Cluster Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Microservices Gateway & Distributed Tests
        run: npm run test:microservices

  docker-validation:
    name: 3. Docker Containerization & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose -f microservices/docker-compose.yml config

      - name: Build Monolith Container
        run: docker build -t sepm-monolith:latest -f monolith/Dockerfile .

      - name: Build Microservices Containers
        run: docker compose -f microservices/docker-compose.yml build

  metrics-evaluation:
    name: 4. SEPM Quantitative Benchmark & Velocity Metrics
    needs: [monolith-validation, microservices-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute SEPM Quantitative Evaluation
        run: npm run benchmark

      - name: Upload SEPM Benchmark Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sepm-evaluation-metrics
          path: benchmarks/sepm_metrics.json
